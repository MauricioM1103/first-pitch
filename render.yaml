services:
  - type: web
    name: first-pitch
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # buildFilter: Skip Render auto-deploys when ONLY data files changed.
    # Without this, every pick snapshot the running app writes back to the
    # repo (via log_persist) triggers a fresh build + deploy, which on free
    # tier burns pipeline minutes until the workspace runs out. Logs now
    # live on the `data` branch by default — this is the belt-and-suspenders
    # case in case anything lands on main.
    buildFilter:
      ignoredPaths:
        - "logs/**"
        - "*.json"
        - "*_cache.json"
        - "*_elo.json"
    # --workers 1: free tier is 512MB; a second worker doubles the resident
    #   memory for backtest caches and tends to tip us over the limit.
    # --max-requests: recycle worker to release leaked / cached allocations
    #   that build up as users browse multiple sports.
    # --preload: load the app in the master BEFORE binding so any import-time
    #   error surfaces immediately in the deploy log instead of making the
    #   worker respawn silently (which looks like "no open ports detected").
    # --log-level info + --access-logfile - --error-logfile -: force gunicorn
    #   to print its usual "Listening at:" line and worker boot messages to
    #   stdout/stderr so Render's deploy log captures them.
    startCommand: gunicorn mlb_ui:app --workers 1 --threads 4 --timeout 120 --max-requests 80 --max-requests-jitter 20 --bind 0.0.0.0:$PORT --preload --log-level info --access-logfile - --error-logfile -

  # Phase 31: drives /cron/dispatch every 15 min on Render's own
  # cron scheduler — more reliable than GitHub Actions, which can lag
  # scheduled runs by 15-60 min on free tier. The dispatcher is
  # idempotent so overlap with the GH Actions workflow is harmless.
  # Keeps the free-tier web service warm as a side effect (so cold
  # starts don't delay user-facing requests).
  - type: cron
    name: cheeks-dispatch
    env: python
    plan: free
    schedule: "*/15 * * * *"
    buildCommand: "echo no-build-needed"
    startCommand: >
      python -c "from urllib.request import urlopen, Request;
      r = Request('https://cheeks-model.onrender.com/cron/dispatch',
      headers={'User-Agent': 'render-cron/1.0'});
      print(urlopen(r, timeout=180).read().decode()[:500])"
